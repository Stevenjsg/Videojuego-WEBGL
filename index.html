<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terror Three</title>
  </head>

  <body>
    <!-- Contenedor del juego (canvas se inserta aquí desde main.ts) -->
    <div id="app">
      <div id="game"></div>
      <div id="loading" class="loading hidden">
      <div class="loading-card">
        <div class="loading-title">Cargando…</div>
        <div class="loading-bar"><div id="loading-bar-fill"></div></div>
        <div id="loading-text" class="loading-text">0%</div>
      </div>
      </div>
      <!-- HUD / UI encima del canvas -->
      <div id="hud">
        <div id="top-left">
          <div id="debug" class="debug hidden"></div>
          <div id="status">Objetos: <span id="items">0</span>/<span id="itemsTotal">0</span></div>
          <div id="battery-container" class="hidden">
            <span id="battery-icon">&#x1F50B;</span>
            <div id="battery-bar"><div id="battery-bar-fill"></div></div>
            <span id="battery-text">100%</span>
          </div>
          <div id="hint">WASD para moverte. Click para capturar ratón.</div>
        </div>

        <div id="center">
          <div id="crosshair"></div>
          <div id="interact-prompt" class="hidden">
            <span class="key-badge">E</span> <span id="interact-text">Abrir / Cerrar</span>
          </div>
          <div id="locked-message" class="hidden"></div>
        </div>

        <!-- Mensajes grandes (game over / win / etc.) -->
        <div id="overlay" class="hidden">
          <div id="overlay-card">
            <div id="overlay-title">PAUSA</div>
            <div id="overlay-text">Pulsa ESC para liberar el ratón.</div>
            <button id="overlay-btn">Reiniciar</button>
          </div>
        </div>

        <!-- Fade oscuro para sustos o transiciones -->
        <div id="fade" class="hidden"></div>
      </div>

      <!-- Menú de pausa (ESC) -->
      <div id="pause-menu" class="hidden">
        <div class="pause-card">
          <div class="pause-title">Pausa</div>
          <button id="pause-resume" class="pause-btn">Continuar</button>
          <button id="pause-restart" class="pause-btn">Reiniciar partida</button>
          <div class="pause-options">
            <label>Sensibilidad del ratón
              <input id="opt-sensitivity" type="range" min="0.3" max="2.5" step="0.05" />
            </label>
            <label>Volumen
              <input id="opt-volume" type="range" min="0" max="1" step="0.05" />
            </label>
            <label class="pause-check">
              <input id="opt-retro" type="checkbox" /> Resolución retro (240p)
            </label>
          </div>
          <div class="pause-hint">Pulsa Continuar para volver al juego</div>
        </div>
      </div>

      <!-- Pantalla de inicio: el juego no arranca hasta pulsar -->
      <div id="start-screen" class="hidden">
        <div id="start-title">Iniciar partida</div>
        <div id="start-hint">Pulsa la pantalla</div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
